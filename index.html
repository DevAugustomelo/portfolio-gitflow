<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfólio</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="main-header">
      <!-- O cabeçalho será desenvolvido na próxima feature -->
      <h1>Portfólio Profissional</h1>
    </header>
    <main class="main-content">
      <!-- SEÇÃO DE BIOGRAFIA / PERFIL -->
      <section class="profile-section">
        <div class="profile-image">
          <img src="https://avatars.githubusercontent.com/u/99753415?v=4" alt="Foto de Perfil" class="avatar">
          <!-- <svg viewBox="0 0 100 100" width="150" height="150"> -->
            <circle cx="50" cy="50" r="50" fill="#2563eb" />
            </text>
          </svg>
        </div>
        <div class="profile-info">
          <h2>Olá, eu sou José Augusto</h2>
          <p>
            Estudante de tecnologia focado em engenharia de software, boas
            práticas de código, versionamento com Gitflow e desenvolvimento
            front-end com padrões atuais de mercado.
          </p>
          <div class="skills-tags">
            <span class="tag">HTML5</span>
            <span class="tag">CSS3</span>
            <span class="tag">Git</span>
            <span class="tag">Gitflow</span>
          </div>
        </div>
      </section>
    </main>
    <footer class="main-footer">
      <p>&copy; 2026 - Desenvolvimento com Gitflow.</p>
    </footer>
  </body>
</html>
